<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | TomTam Rewards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-panel">
        <div class="auth-side">
          <h2>Beauty. Confidence. You.</h2>
          <p>
            Welcome back to your member dashboard. Keep tracking your rewards, referral progress,
            and your next beauty reward in one place.
          </p>

          <div class="card-showcase">
            <div class="title">Your reward card</div>
            <div class="name">TOMTAM</div>
            <div class="note">Beauty Store</div>
            <div class="count">
              <span class="filled">✓</span>
              <span>2</span>
              <span>3</span>
              <span>4</span>
              <span>5</span>
            </div>
          </div>
        </div>

        <div class="auth-form">
          <h3 class="form-title">Sign in</h3>

          <form id="signInForm">
            <div class="form-grid">
              <div class="field-block full-width">
                <label for="username">Username or email</label>
                <input id="username" type="text" placeholder="your username or email" required />
              </div>

              <div class="field-block full-width">
                <label for="password">Password</label>
                <div class="password-wrap">
                  <input id="password" type="password" placeholder="Enter your password" required />
                  <button type="button" class="toggle-password" aria-label="Show password">Show</button>
                </div>
              </div>
            </div>

            <label class="inline-check">
              <input type="checkbox" /> Remember me
            </label>

            <button class="auth-submit" type="submit">Sign in to my account</button>
          </form>

          <div class="switch-copy">New here? <a href="signup.html">Create account</a></div>
          <div style="margin-top: 18px;">
            <a class="btn primary full" href="https://tomtambeautystore.netlify.app" target="_blank" rel="noopener">Shop now</a>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
